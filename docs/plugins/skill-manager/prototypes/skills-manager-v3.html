<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH · 技能管理 v3.2</title>
<style>
  /* ============ 1. DSH tokens（原型内近似值，命名与用途与 DSH 一致） ============ */
  :root {
    --dsw-alias-bg-base: #151517;
    --dsw-specific-sidebar-fill: #1b1b1c;
    --dsw-static-neutral-bluish-850: #2c2c2e;
    --dsw-alias-bg-layer-1: #232324;
    --dsw-alias-bg-layer-2: #2c2c2e;
    --dsw-alias-bg-layer-3: #353638;
    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-label-tertiary: #adb2b8;
    --dsw-alias-label-caption: #81858c;
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-border-l2: #ffffff1f;
    --dsw-alias-border-l3: #ffffff29;
    --dsw-alias-border-inverted: #ffffff1f;
    --dsw-alias-interactive-bg-hover: #ffffff14;
    --dsw-specific-sidebar-nav-item-active: #43454a;
    --dsw-alias-button-primary-fill: #f9fafb;
    --dsw-alias-label-primary-foreground: #0f1115;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-error-primary: #f25a5a;
    --dsw-alias-state-business-primary: #5b9dff;
    --dsw-alias-brand-primary: #7aaaff;
    --dsw-alias-settings-card-fill: #1d1d1f;
    --dsw-alias-settings-card-stroke: #ffffff1f;
    --dsw-radius-lg: 12px;
    --dsw-radius-xl: 16px;
    --dsw-radius-panel: 20px;
    --dsw-focus-ring-color: #7aaaff;
    --dsw-focus-ring-width: 2px;
  }

  /* ============ 2. 基础 ============ */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; outline: none; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: var(--dsw-focus-ring-width) solid var(--dsw-focus-ring-color);
    outline-offset: 1px;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dsw-alias-border-l3); border-radius: 999px; }

  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* 字号阶梯：一律基于 --sm-fs */
  .sm-root { --sm-fs: var(--dsh-content-font-size, 14px); font-size: calc(var(--sm-fs) - 1px); line-height: 1.5; }
  .fs-16 { font-size: calc(var(--sm-fs) + 2px); line-height: 1.4; }
  .fs-15 { font-size: calc(var(--sm-fs) + 1px); line-height: 1.4; }
  .fs-14 { font-size: var(--sm-fs); line-height: 1.45; }
  .fs-13 { font-size: calc(var(--sm-fs) - 1px); line-height: 1.45; }
  .fs-12 { font-size: calc(var(--sm-fs) - 2px); line-height: 1.4; }
  .fs-11 { font-size: calc(var(--sm-fs) - 3px); line-height: 1.35; }
  .fs-10 { font-size: calc(var(--sm-fs) - 4px); line-height: 1.35; }

  /* ============ 3. 原型切换条 ============ */
  .pb {
    height: 44px; padding: 0 14px;
    background: var(--dsw-specific-sidebar-fill);
    border-bottom: 1px solid var(--dsw-alias-border-l2);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: relative; z-index: 100;
  }
  .pb-left, .pb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pb-brand { font-size: 12px; font-weight: 600; color: var(--dsw-alias-label-primary); white-space: nowrap; }
  .pb-ver { font-size: 10px; color: var(--dsw-alias-label-caption); border: 1px solid var(--dsw-alias-border-l2); padding: 1px 5px; border-radius: 999px; white-space: nowrap; }
  .pb-label { font-size: 11px; color: var(--dsw-alias-label-caption); white-space: nowrap; }
  .proto-select, .proto-btn {
    height: 27px; padding: 0 9px; border-radius: 8px;
    background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-secondary);
    font-size: 12px; display: inline-flex; align-items: center; gap: 4px;
  }
  .proto-select { max-width: 380px; }
  .proto-btn:hover, .proto-select:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .pb-date { font-size: 11px; color: var(--dsw-alias-label-caption); white-space: nowrap; }

  /* ============ 4. 宿主壳 ============ */
  .sm-root { height: calc(100vh - 44px); display: flex; flex-direction: column; background: var(--dsw-alias-bg-base); }
  #dsh-shell { display: flex; width: 100%; height: 100%; overflow: hidden; }
  #dsh-sidebar {
    width: 210px; height: 100%; flex-shrink: 0;
    background: var(--dsw-specific-sidebar-fill);
    border-right: 1px solid var(--dsw-alias-border-l1);
    padding: 12px 10px; display: flex; flex-direction: column; justify-content: space-between;
    user-select: none;
  }
  .sm-nav { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .sm-nav-row {
    height: 36px; padding: 7px 9px; border-radius: 12px;
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    color: var(--dsw-alias-label-secondary); font-size: var(--sm-fs);
  }
  .sm-nav-row:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .sm-nav-row[aria-current="page"] { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); font-weight: 500; }
  .sm-nav-glyph { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sm-nav-ver { font-size: calc(var(--sm-fs) - 4px); color: var(--dsw-alias-label-caption); padding: 4px 8px; }

  #main-panel { flex: 1; height: 100%; overflow-y: auto; padding: 28px 48px 48px; background: var(--dsw-alias-bg-base); }
  .page-col { width: 100%; max-width: 960px; margin: 0 auto; container-type: inline-size; }

  /* ============ 5. 页头、工具栏、Tab ============ */
  .sm-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .sm-page-title { margin: 0; font-size: calc(var(--sm-fs) + 2px); line-height: 1.4; font-weight: 500; }
  .sm-page-desc { margin: 4px 0 0; font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); }
  .sm-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sm-search { position: relative; width: 232px; height: 33px; }
  .sm-search input {
    width: 100%; height: 33px; padding: 0 28px 0 32px; border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-primary); font-size: calc(var(--sm-fs) - 1px);
  }
  .sm-search input::placeholder { color: var(--dsw-alias-label-caption); }
  .sm-search .sm-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dsw-alias-label-caption); pointer-events: none; display: inline-flex; }
  .sm-search kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: calc(var(--sm-fs) - 4px); color: var(--dsw-alias-label-caption);
    padding: 0 5px; border-radius: 4px; border: 1px solid var(--dsw-alias-border-l2); pointer-events: none;
  }
  .btn {
    height: 32px; padding: 0 12px; border-radius: 12px; font-size: calc(var(--sm-fs) - 1px); font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .btn-sm { height: 28px; padding: 0 10px; border-radius: 10px; font-size: calc(var(--sm-fs) - 2px); }
  .btn-primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; }
  .btn-secondary { background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-primary); border: 1px solid var(--dsw-alias-border-l2); }
  .btn-secondary:hover:not(:disabled) { background: var(--dsw-alias-bg-layer-3); }
  .btn-ghost { background: transparent; color: var(--dsw-alias-label-secondary); padding: 0 10px; }
  .btn-ghost:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .btn-danger { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 88%, var(--dsw-alias-bg-base)); color: var(--dsw-alias-label-primary); }
  .btn-danger-ghost { background: transparent; color: var(--dsw-alias-state-error-primary); border: 1px solid color-mix(in srgb, var(--dsw-alias-state-error-primary) 32%, transparent); }
  .btn-danger-ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 12%, transparent); }
  .sm-icon-btn {
    width: 32px; height: 32px; padding: 0; border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-secondary); display: inline-flex; align-items: center; justify-content: center;
  }
  .sm-icon-btn:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .sm-icon-btn.plain { background: transparent; border-color: transparent; }
  .sm-icon-btn.plain:hover { background: var(--dsw-alias-interactive-bg-hover); }
  /* v3.2 工具栏图标按钮：30×30、图标 16、间距 6 */
  .sm-toolbar-icons { display: inline-flex; align-items: center; gap: 6px; }
  .sm-tool-btn {
    width: 30px; height: 30px; padding: 0; border-radius: 10px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-secondary); display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sm-tool-btn:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .sm-spin { animation: sm-spin 800ms linear infinite; }
  @keyframes sm-spin { to { transform: rotate(360deg); } }
  .sm-select {
    height: 33px; padding: 0 10px; border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-secondary); font-size: calc(var(--sm-fs) - 1px);
  }
  .sm-tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .sm-segmented { height: 34px; background: var(--dsw-alias-bg-layer-3); border-radius: 14px; padding: 2px; display: inline-flex; align-items: center; gap: 2px; }
  .sm-seg-tab { height: 30px; padding: 0 14px; border-radius: 12px; font-size: var(--sm-fs); color: var(--dsw-alias-label-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .sm-seg-tab[aria-selected="true"] { background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary); font-weight: 500; }

  /* 二级 Tab（仅技能 Tab） */
  .sm-subtabs-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sm-subtabs { height: 34px; background: var(--dsw-alias-bg-layer-2); border-radius: 14px; padding: 2px; display: inline-flex; align-items: center; gap: 2px; }
  .sm-subtab { height: 30px; padding: 0 12px; border-radius: 12px; font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .sm-subtab:hover { color: var(--dsw-alias-label-primary); }
  .sm-subtab[aria-selected="true"] { background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary); font-weight: 500; }
  .sm-count-badge {
    min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px;
    background: var(--dsw-alias-bg-layer-3); color: var(--dsw-alias-label-secondary);
    font-size: calc(var(--sm-fs) - 4px); font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sm-subtab[aria-selected="true"] .sm-count-badge { background: var(--dsw-specific-sidebar-nav-item-active); color: var(--dsw-alias-label-primary); }

  /* 状态图标（替代横幅） */
  .sm-status-icons { display: flex; align-items: center; gap: 2px; margin-left: auto; }
  .sm-status-btn {
    width: 32px; height: 32px; padding: 0; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--dsw-alias-label-secondary);
  }
  .sm-status-btn:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .sm-status-btn.warn { color: var(--dsw-alias-state-warn-primary); }
  .sm-status-btn.update { color: var(--dsw-alias-state-business-primary); }

  /* ============ 6. 卡片网格 ============ */
  .sm-dot { position: absolute; left: 5px; bottom: 5px; width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid var(--dsw-alias-bg-base); }
  .sm-dot-ok { background: var(--dsw-alias-state-success-primary); }
  .sm-dot-warn { background: var(--dsw-alias-state-warn-primary); }
  .sm-dot-idle { background: var(--dsw-alias-label-caption); }
  .sm-dot-error { background: var(--dsw-alias-state-error-primary); }
  .sm-dot-update { background: var(--dsw-alias-brand-primary); }

  .sm-chevron { display: inline-flex; color: var(--dsw-alias-label-caption); width: 14px; }
  .sm-tagbar { display: inline-flex; align-items: center; gap: 5px; max-width: 340px; overflow: hidden; flex-wrap: nowrap; flex-shrink: 1; }
  .sm-badge {
    font-size: calc(var(--sm-fs) - 3px); padding: 1px 8px; border-radius: 999px;
    background: var(--dsw-alias-bg-layer-2); color: var(--dsw-alias-label-secondary);
    border: 1px solid var(--dsw-alias-border-l1); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
  }
  .sm-badge.update {
    background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 12%, transparent);
    color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 82%, var(--dsw-alias-label-primary));
    border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 28%, transparent);
    font-weight: 500;
  }
  .sm-badge.warn { background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 14%, transparent); color: var(--dsw-alias-state-warn-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 32%, transparent); }
  .sm-badge.error { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 14%, transparent); color: var(--dsw-alias-state-error-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-error-primary) 32%, transparent); }
  .sm-badge.success { background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 14%, transparent); color: var(--dsw-alias-state-success-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 32%, transparent); }

  .sm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @container (max-width: 720px) {
    .sm-grid { grid-template-columns: minmax(0, 1fr); }
  }
  .sm-card-item {
    min-height: 96px; padding: 12px; display: flex; align-items: flex-start; gap: 12px;
    border: .5px solid var(--dsw-alias-settings-card-stroke);
    border-radius: var(--dsw-radius-xl);
    background: var(--dsw-alias-settings-card-fill);
    cursor: pointer; transition: background 120ms, border-color 120ms;
    min-width: 0;
  }
  .sm-card-item:hover { background: color-mix(in srgb, var(--dsw-alias-settings-card-fill) 72%, var(--dsw-alias-bg-layer-3)); border-color: var(--dsw-alias-border-l3); }
  .sm-card-item.is-highlight { outline: 1.5px solid var(--dsw-alias-brand-primary); outline-offset: -1px; }
  .sm-card-item.is-disabled { opacity: .6; }
  .sm-card-icon {
    width: 48px; height: 48px; border-radius: var(--dsw-radius-lg); flex-shrink: 0; position: relative;
    background: var(--dsw-alias-bg-layer-2); border: .5px solid var(--dsw-alias-border-l2);
    display: flex; align-items: center; justify-content: center; color: var(--dsw-alias-label-secondary);
  }
  .sm-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding-top: 1px; }
  .sm-card-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sm-card-name { font-size: var(--sm-fs); font-weight: 500; color: var(--dsw-alias-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sm-card-desc {
    font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-tertiary); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sm-card-item.is-disabled .sm-card-name { color: var(--dsw-alias-label-caption); }
  .sm-card-item.is-disabled .sm-card-desc { color: var(--dsw-alias-label-caption); }
  /* v3.2：⋯ 在左、主按钮在右，同一行、右对齐 */
  .sm-card-tail {
    margin-left: auto; flex-shrink: 0; align-self: center;
    display: inline-flex; flex-direction: row; align-items: center; justify-content: flex-end; gap: 6px;
  }
  .sm-card-more {
    width: 26px; height: 26px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity 120ms ease;
  }
  .sm-card-item:hover .sm-card-more,
  .sm-card-item:focus-within .sm-card-more,
  .sm-card-more:focus-visible { opacity: 1; pointer-events: auto; }

  /* ============ 7. 市场按源分组 / 技能 Tab 内按来源分组 ============ */
  .sm-market-blocks { display: flex; flex-direction: column; gap: 28px; }
  .sm-skill-groups { gap: 24px; }
  .sm-source-block { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .sm-source-block-head { display: flex; align-items: center; gap: 8px; padding: 0 2px; min-width: 0; }
  .sm-source-block-title { font-size: var(--sm-fs); font-weight: 500; color: var(--dsw-alias-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sm-source-block-count { font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); white-space: nowrap; }
  .sm-source-block-actions { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }

  /* 空态 / 搜索无结果 */
  .sm-empty { padding: 64px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .sm-empty-icon {
    width: 96px; height: 96px; border-radius: 24px; margin-bottom: 6px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    display: flex; align-items: center; justify-content: center; color: var(--dsw-alias-label-caption);
  }
  .sm-empty-title { font-size: calc(var(--sm-fs) + 1px); font-weight: 500; color: var(--dsw-alias-label-primary); }
  .sm-empty-desc { font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); max-width: 400px; }
  .sm-empty-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }

  /* ============ 8. 详情 ============ */
  .sm-back { font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-tertiary); display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 8px; margin-bottom: 14px; }
  .sm-back:hover { color: var(--dsw-alias-label-primary); background: var(--dsw-alias-interactive-bg-hover); }
  .sm-detail-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .sm-detail-icon {
    width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; position: relative;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    display: flex; align-items: center; justify-content: center; color: var(--dsw-alias-label-secondary);
  }
  .sm-detail-heading { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
  .sm-detail-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sm-detail-name { font-size: calc(var(--sm-fs) + 2px); font-weight: 500; line-height: 1.3; }
  .sm-detail-ver { font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); }
  .sm-detail-desc { font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); max-width: 640px; }
  .sm-detail-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sm-detail-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); gap: 24px; align-items: start; margin-top: 22px; }
  .sm-detail-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* ============ 9. 抽屉 ============ */
  .sm-drawer-backdrop { position: fixed; top: 44px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 1100; }

    position: fixed; top: 44px; right: 0; bottom: 0; width: 520px; max-width: 94vw;

  }
  .sm-drawer.sources { width: 560px; }
  .sm-drawer-head { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--dsw-alias-border-l1); flex-shrink: 0; }
  .sm-drawer-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sm-drawer-title { font-size: calc(var(--sm-fs) + 1px); font-weight: 500; }
  .sm-drawer-body { padding: 18px 20px 28px; overflow-y: auto; min-height: 0; }
  .sm-drawer-intro { margin: 0 0 16px; font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); line-height: 1.6; }
  .sm-issue { padding: 14px; border-radius: 16px; background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2); display: flex; flex-direction: column; gap: 8px; }
  .sm-issue-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sm-issue-icon { width: 30px; height: 30px; border-radius: 10px; background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 14%, transparent); color: var(--dsw-alias-state-warn-primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sm-issue-reason { margin: 0; font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); line-height: 1.65; }
  .sm-issue-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sm-details { border-top: 1px solid var(--dsw-alias-border-l1); padding-top: 8px; }
  .sm-details summary { cursor: pointer; font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); list-style: none; display: inline-flex; align-items: center; gap: 5px; user-select: none; }
  .sm-details summary::-webkit-details-marker { display: none; }
  .sm-details summary:hover { color: var(--dsw-alias-label-secondary); }
  .sm-details[open] summary .sm-chevron { transform: rotate(90deg); }
  .sm-details-body { padding-top: 8px; }
  .sm-details-body .sm-kv { padding: 6px 0; }
  .sm-drawer-note { margin: 14px 0 0; font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-label-caption); line-height: 1.6; }
  .sm-issue-ok { border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 30%, transparent); }
  .sm-issue-ok .sm-issue-icon { background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 14%, transparent); color: var(--dsw-alias-state-success-primary); }

  /* 源（v3.2：弹窗内列表，整行拖动排序） */
  .sm-source {
    padding: 10px 12px; border-radius: 14px; background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l2); display: flex; flex-direction: column; gap: 4px;
    position: relative;
  }
  .sm-source.is-off { opacity: 0.6; }
  .sm-source.is-dragging { opacity: 0.4; }
  .sm-source.is-drop-before::before,
  .sm-source.is-drop-after::after {
    content: ''; position: absolute; left: 8px; right: 8px; height: 2px;
    border-radius: 2px; background: var(--dsw-alias-brand-primary); pointer-events: none;
  }
  .sm-source.is-drop-before::before { top: -5px; }
  .sm-source.is-drop-after::after { bottom: -5px; }
  .sm-drag-handle {
    width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    color: var(--dsw-alias-label-caption); cursor: grab;
  }
  .sm-source:active .sm-drag-handle, .sm-source.is-dragging .sm-drag-handle { cursor: grabbing; }
  .sm-source-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sm-source-top .sm-dot { position: static; border: none; flex-shrink: 0; }
  .sm-source-name { font-size: var(--sm-fs); font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sm-source-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .sm-source-actions .sm-icon-btn { width: 28px; height: 28px; border-radius: 9px; }
  .sm-source-url { font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-label-caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sm-source-meta { font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-label-caption); }
  .sm-source-error { font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-state-error-primary); line-height: 1.5; }
  .sm-switch { width: 36px; height: 20px; border-radius: 999px; background: var(--dsw-alias-border-l3); position: relative; display: inline-flex; align-items: center; padding: 2px; flex-shrink: 0; }
  .sm-switch[aria-checked="true"] { background: var(--dsw-alias-button-primary-fill); }
  .sm-switch-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--dsw-alias-bg-base); transform: translateX(0); transition: transform 150ms ease; }
  .sm-switch[aria-checked="true"] .sm-switch-thumb { transform: translateX(16px); }
  .sm-add-source { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--dsw-alias-border-l1); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .sm-add-label { font-size: calc(var(--sm-fs) - 2px); font-weight: 500; color: var(--dsw-alias-label-secondary); }
  .sm-add-row { display: flex; align-items: center; gap: 8px; }
  .sm-input {
    width: 100%; height: 33px; padding: 0 12px; border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-primary); font-size: calc(var(--sm-fs) - 1px);
  }
  .sm-input::placeholder, textarea.sm-input::placeholder { color: var(--dsw-alias-label-caption); }
  .sm-add-row .sm-input { flex: 1; min-width: 0; }

  /* ============ 10. 弹窗 ============ */
  .sm-modal-layer { position: fixed; inset: 0; z-index: 1300; display: flex; align-items: center; justify-content: center; padding: 16px; background: transparent; }
  .sm-dialog {
    width: min(488px, 100%); max-height: 88vh;
    background: var(--dsw-static-neutral-bluish-850, var(--dsw-alias-bg-layer-1));
    border: .5px solid var(--dsw-alias-border-inverted); border-radius: var(--dsw-radius-panel);
    box-shadow: none; display: flex; flex-direction: column; overflow: hidden;
  }
  .sm-dialog.form { width: min(488px, 100%); border-radius: var(--dsw-radius-panel); }
  .sm-dialog.confirm { width: min(480px, 100vw - 32px); border-radius: var(--dsw-radius-xl); }
  .sm-dialog.large { width: min(720px, 100%); border-radius: var(--dsw-radius-panel); }
  /* v3.2 管理源：居中大弹窗，720 档 + 视口余量 32px，列表内部滚动 */
  .sm-dialog.sources {
    width: min(720px, 100vw - 32px);
    max-height: min(720px, 100vh - 96px);
    border-radius: var(--dsw-radius-panel);
  }
  .sm-dialog.sources .sm-dialog-body {
    display: flex; flex-direction: column; overflow: hidden; padding-top: 14px; padding-bottom: 16px;
  }
  .sm-dialog-head { padding: 18px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .sm-dialog-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sm-dialog-title { font-size: calc(var(--sm-fs) + 1px); font-weight: 500; }
  .sm-dialog-sub { margin: 4px 0 0; font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); }
  .sm-dialog-intro { margin: 0 0 12px; font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); line-height: 1.6; flex-shrink: 0; }
  .sm-source-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding-right: 2px; }
  .sm-dialog-body { padding: 16px 20px; overflow-y: auto; min-height: 0; }
  .sm-dialog.form .sm-dialog-body { padding-top: 38px; }
  .sm-dialog.large .sm-dialog-body { padding-top: 18px; }
  .sm-dialog-foot { min-height: 56px; padding: 12px 20px; border-top: 1px solid var(--dsw-alias-border-l1); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
  .sm-form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .sm-form-field:last-child { margin-bottom: 0; }
  .sm-form-label { font-size: calc(var(--sm-fs) - 2px); font-weight: 500; color: var(--dsw-alias-label-secondary); display: flex; justify-content: space-between; gap: 8px; }
  .sm-form-hint { font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-label-caption); font-weight: 400; }
  textarea.sm-input { height: auto; padding: 8px 12px; resize: vertical; min-height: 62px; line-height: 1.55; }
  .sm-confirm { padding: 2px 0 4px; display: flex; flex-direction: column; gap: 12px; }
  textarea.sm-input.sm-edit-body { min-height: 320px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: calc(var(--sm-fs) - 2px); line-height: 1.65; }
  .sm-dropzone {
    padding: 28px 20px; border-radius: var(--dsw-radius-lg); text-align: center;
    border: 1px dashed var(--dsw-alias-border-l3); background: var(--dsw-alias-bg-layer-1);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .sm-dropzone-icon { color: var(--dsw-alias-label-caption); display: inline-flex; }
  .sm-dropzone-title { font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); }
  .sm-dropzone-hint { font-size: calc(var(--sm-fs) - 3px); color: var(--dsw-alias-label-caption); }
  .sm-confirm-ver { display: flex; align-items: center; gap: 8px; font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-secondary); flex-wrap: wrap; }
  .sm-confirm-ver .mono { color: var(--dsw-alias-label-primary); }
  .sm-confirm-note { font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-caption); line-height: 1.65; margin: 0; }
  .sm-confirm-warn { padding: 9px 11px; border-radius: 10px; background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 10%, transparent); border: 1px solid color-mix(in srgb, var(--dsw-alias-state-warn-primary) 26%, transparent); font-size: calc(var(--sm-fs) - 2px); color: var(--dsw-alias-label-secondary); line-height: 1.55; }
  .sm-danger-text { color: var(--dsw-alias-state-error-primary); }

  /* ============ 11. 菜单 / Toast / Tooltip ============ */
  .sm-menu {
    position: fixed; z-index: 1600; width: 184px; padding: 4px;
    border-radius: 12px; background: var(--dsw-static-neutral-bluish-850, var(--dsw-alias-bg-layer-2));
    border: 1px solid var(--dsw-alias-border-l2); box-shadow: none; display: flex; flex-direction: column; gap: 2px;
  }
  .sm-menu-item {
    height: 32px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px;
    font-size: calc(var(--sm-fs) - 1px); color: var(--dsw-alias-label-primary); text-align: left; width: 100%;
  }
  .sm-menu-item:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .sm-menu-item .sm-menu-icon { display: inline-flex; color: var(--dsw-alias-label-secondary); width: 16px; }
  .sm-menu-item.danger { color: var(--dsw-alias-state-error-primary); }
  .sm-menu-item.danger .sm-menu-icon { color: var(--dsw-alias-state-error-primary); }
  .sm-menu-item:disabled { opacity: .38; cursor: not-allowed; }
  .sm-menu-item:disabled:hover { background: transparent; }
  .sm-menu-sep { height: 1px; background: var(--dsw-alias-border-l1); margin: 3px 4px; }

  #toast-host { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 1800; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .sm-toast {
    padding: 8px 14px; border-radius: 12px; background: var(--dsw-alias-bg-layer-3);
    border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-primary);
    font-size: calc(var(--sm-fs) - 1px); box-shadow: none; display: inline-flex; align-items: center; gap: 8px; pointer-events: auto;
  }
  /* The element is #tooltip; the old #sm-tooltip selector left the tooltip
      * unstyled, so it rendered off-flow and was invisible. */
  #tooltip {
    position: fixed; z-index: 2000; font-size: calc(var(--sm-fs) - 4px); color: var(--dsw-alias-label-secondary);
    background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2);
    box-shadow: none; border-radius: 7px; padding: 6px 10px; max-width: 290px; line-height: 1.35;
    pointer-events: none; opacity: 0; transition: opacity 110ms;
  }
  #tooltip.visible { opacity: 1; }

  /* ============ 12. 响应式 ============ */
  @media (max-width: 1120px) {
    #main-panel { padding: 24px 24px 40px; }
    .sm-search { width: 200px; }
    .sm-detail-grid { gap: 16px; }
  }
  @media (max-width: 900px) {
    .sm-detail-grid { grid-template-columns: 1fr; }
  }
</style>

function baseState() {
  return {
    screen: 'list',
    tab: 'skills',
    view: 'list',
    detail: null,
    search: '',
    marketSearch: '',
    sort: 'name',
    marketSort: 'recommend',
    category: 'mine',
    omit: [],
    empty: false,
    noSources: false,
    diagOpen: false,
    sourcesOpen: false,
    checking: false,
    modal: null,
    issueFixed: false,
    issueCount: 1,
    highlight: null,
    menu: null,
    saveTo: 'mine',
    installTarget: 'mine',
    sources: (() => {
      const order = loadSourceOrder();
      const list = SOURCES.map(s => Object.assign({}, s));
      if (!order || !order.length) return list;
      const rank = id => {
        const idx = order.indexOf(id);
        return idx < 0 ? order.length + 1 : idx;
      };
      return list.sort((a, b) => rank(a.id) - rank(b.id));
    })()
  };
}

const state = baseState();

function applyScreen(id) {
  const preset = SCREENS.find(s => s.id === id) || SCREENS[0];
  const next = baseState();
  const patch = preset.state || {};
  Object.keys(patch).forEach(k => {
    next[k] = patch[k];
  });
  if (patch.sourceOrder) {
    const order = patch.sourceOrder;
    next.sources.sort((a, b) => {
      const ia = order.indexOf(a.id);
      const ib = order.indexOf(b.id);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    });
  }
  next.screen = preset.id;
  Object.keys(state).forEach(k => { delete state[k]; });
  Object.assign(state, next);
  const sel = document.getElementById('screen-select');
  if (sel) sel.value = preset.id;
  render();
}

function stepScreen(dir) {
  const idx = SCREENS.findIndex(s => s.id === state.screen);
  const next = (idx + dir + SCREENS.length) % SCREENS.length;
  applyScreen(SCREENS[next].id);
}

function setFont(v) {
  document.getElementById('app').style.setProperty('--sm-fs', v + 'px');
}

function initScreenSelect() {
  const sel = document.getElementById('screen-select');
  sel.innerHTML = SCREENS.map(s => '<option value="' + s.id + '">' + escapeHtml(s.label) + '</option>').join('');
  const q = new URLSearchParams(location.search).get('screen');
  applyScreen(q || 'list');
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function effectiveStatus(skill) {
  if (skill.id === 'ego-browser' && state.issueFixed) return 'active';
  return skill.status;
}

function statusLabel(st) {
  if (st === 'active') return '生效中';
  if (st === 'broken') return '未生效';
  if (st === 'disabled') return '已停用';
  return '生效中';
}

function statusDot(st) {
  if (st === 'active') return 'sm-dot-ok';
  if (st === 'broken') return 'sm-dot-warn';
  if (st === 'disabled') return 'sm-dot-idle';
  return 'sm-dot-ok';
}

function updateBadge(version, id) {
  const attr = id
    ? ' style="cursor:pointer" onclick="event.stopPropagation();openModal(\'update\',\'' + id + '\')"'
    : '';
  return '<span class="sm-badge update mono"' + attr + ' data-tip="可更新到 v' + escapeHtml(version) + '">'
    + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M8.5 11.5L12 8m0 0l3.5 3.5M12 8v8"/></svg>'
    + '<span>v' + escapeHtml(version) + '</span></span>';
}

function codeBlock(text) {
  const lines = String(text || '').split('\n');
  return '<div class="sm-code">' + lines.map((line, i) =>
    '<div class="sm-code-line"><span class="sm-ln">' + (i + 1) + '</span><span class="sm-code-text">' + (escapeHtml(line) || ' ') + '</span></div>'
  ).join('') + '</div>';
}

function renderFooter() {
  return '<footer class="sm-footer">v3.2 · 2026-11-09</footer>';
}

function visibleSkills() {
  return SKILLS.filter(s => state.omit.indexOf(s.id) < 0);
}

function issueCountNow() {
  if (state.empty) return 0;
  if (state.issueFixed) return 0;
  return state.issueCount === 2 ? 2 : 1;
}

function updateCountNow() {
  if (state.empty) return 0;
  return visibleSkills().filter(s => effectiveStatus(s) === 'active' && s.update).length;
}

function renderStatusIcons() {
  const warn = issueCountNow();
  const upd = updateCountNow();
  let html = '<div class="sm-status-icons">';
  if (warn > 0) {
    html += `<button class="sm-status-btn warn" aria-label="查看未生效技能" data-tip="${warn} 个技能未生效" onclick="openDiag()">${icon('alert', 16)}</button>`;

  }
  html += '</div>';
  return html;
}

  if (state.empty) {
    content += renderSubTabs(skills);

      <div class="sm-empty-icon">${icon('skill', 40)}</div>
      <div class="sm-empty-title">还没有技能</div>

      </div>
    </div>`;
    return '<div class="page-col">' + content + renderFooter() + '</div>';
  }

  const q = state.search.trim().toLowerCase();
  const matches = s => {
    if (!q) return true;
    return (s.name + ' ' + s.desc + ' ' + (s.when || '')).toLowerCase().includes(q);
  };

  // 跨分类搜索：命中后自动切到第一个有结果的分类，搜索词保持不变
  if (q) {
    const allMatched = skills.filter(matches);
    const first = CATEGORIES.filter(c => allMatched.some(s => s.group === c.key))[0];
    if (first) state.category = first.key;
  }

  content += renderSubTabs(skills);
  content += '<div class="sm-subview">';

  if (q && skills.filter(matches).length === 0) {
    content += `<div class="sm-empty">
      <div class="sm-empty-icon">${icon('search', 36)}</div>
      <div class="sm-empty-title">没有匹配「${escapeHtml(state.search.trim())}」的技能</div>

      <div class="sm-empty-actions"><button class="btn btn-secondary" onclick="clearSearch()">清除搜索</button></div>
    </div>`;
    content += '</div>';
    return '<div class="page-col">' + content + renderFooter() + '</div>';
  }

  const cat = CATEGORIES.find(c => c.key === state.category) || CATEGORIES[0];
  const items = skills.filter(s => s.group === cat.key && matches(s));
  const sorted = items.slice().sort((a, b) => {
    if (state.sort === 'recent') return b.mtime - a.mtime;
    return a.name.localeCompare(b.name);
  });

  if (sorted.length === 0) {
    // Built-in skills cannot be created by the user, so that category keeps a
    // single exit (browse the market) instead of the two-action empty state.
    const actions = cat.key === 'system'
      ? `<div class="sm-empty-actions">
        <button class="btn btn-secondary" onclick="switchTab('market')">去市场看看</button>
      </div>`
      : `<div class="sm-empty-actions">
        <button class="btn btn-primary" onclick="switchTab('market')">去市场看看</button>
        <button class="btn btn-secondary" onclick="openModal('new')">${icon('plus', 15)} 新建技能</button>
      </div>`;
    content += `<div class="sm-empty">
      <div class="sm-empty-icon">${icon(cat.icon || 'skill', 40)}</div>
      <div class="sm-empty-title">${cat.emptyTitle}</div>
      <div class="sm-empty-desc">${cat.emptyDesc}</div>
      ${actions}
    </div>`;
    content += '</div>';
    return '<div class="page-col">' + content + renderFooter() + '</div>';
  }

  // 系统内置全部来自 Harness 本身，不按来源分组；其余 Tab 内再按来源分组
  if (cat.key === 'system') {
    content += '<div class="sm-grid">' + sorted.map(renderSkillCard).join('') + '</div>';
  } else {
    content += renderSkillGroups(sorted);
  }
  content += '</div>';
  return '<div class="page-col">' + content + renderFooter() + '</div>';
}

// v3.2：组头顺序 = 市场源顺序（state.sources），「本地创建」固定最后；空组不渲染。
function skillSourceGroup(skill) {
  if (skill.builtin || !skill.sourceId) return { key: 'local', name: '本地创建' };
  const src = state.sources.find(s => s.id === skill.sourceId);
  return src ? { key: src.id, name: src.name } : { key: 'local', name: '本地创建' };
}

function renderSkillGroups(skills) {
  const groups = state.sources.map(src => ({ key: src.id, name: src.name, items: [] }));
  groups.push({ key: 'local', name: '本地创建', items: [] });
  const byKey = {};
  groups.forEach(g => { byKey[g.key] = g; });
  skills.forEach(skill => {
    const meta = skillSourceGroup(skill);
    (byKey[meta.key] || byKey.local).items.push(skill);
  });
  const html = groups.filter(g => g.items.length > 0).map(g =>
    `<section class="sm-source-block" data-source-group="${g.key}">
      <div class="sm-source-block-head">
        <span class="sm-source-block-title">${escapeHtml(g.name)}</span>
        <span class="sm-source-block-count">${g.items.length} 个技能</span>
      </div>
      <div class="sm-grid">${g.items.map(renderSkillCard).join('')}</div>
    </section>`
  ).join('');
  return '<div class="sm-market-blocks sm-skill-groups">' + html + '</div>';
}

function renderSkillCard(skill) {
  const st = effectiveStatus(skill);
  const isDisabled = st === 'disabled';
  const isBroken = st === 'broken';
  const isHighlight = state.highlight === skill.id;

  let badges = '';
  if (skill.update) badges += updateBadge(skill.update, skill.id);
  if (isBroken) badges += '<span class="sm-badge warn">未生效</span>';
  if (isDisabled) badges += '<span class="sm-badge">已停用</span>';

  // The skills page lists what is already installed, so it never offers an
  // install action; only an available update gets a primary button.
  const primary = skill.update
    ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openModal('update','${skill.id}')">更新</button>`
    : '';

  return `<div class="sm-card-item${isDisabled ? ' is-disabled' : ''}${isHighlight ? ' is-highlight' : ''}" data-skill-id="${skill.id}" role="button" tabindex="0"
      onclick="openDetail('installed','${skill.id}')" onkeydown="if(event.key==='Enter') openDetail('installed','${skill.id}')">
    <div class="sm-card-icon">${icon('skill', 22)}<span class="sm-dot ${statusDot(st)}" data-tip="${statusLabel(st)}"></span></div>
    <div class="sm-card-main">
      <div class="sm-card-title-row">
        <span class="sm-card-name mono" title="${escapeHtml(skill.name)}">${escapeHtml(skill.name)}</span>
        ${badges ? '<span class="sm-tagbar">' + badges + '</span>' : ''}
      </div>
      <div class="sm-card-desc">${escapeHtml(skill.desc)}</div>
    </div>
    <div class="sm-card-tail" onclick="event.stopPropagation()">
      <button class="sm-icon-btn plain sm-card-more" aria-label="更多操作" data-tip="更多操作" onclick="event.stopPropagation();openRowMenu(event,'${skill.id}')">${icon('more', 16)}</button>
      ${primary}
    </div>
  </div>`;
}

/*************************************************************************
 * 6. 市场 Tab
 *************************************************************************/
function renderMarketPage() {
  let content = renderListHeader('market');
  const enabled = state.sources.filter(s => s.enabled);

  if (state.noSources || enabled.length === 0) {
    content += `<div class="sm-empty">
      <div class="sm-empty-icon">${icon('market', 40)}</div>
      <div class="sm-empty-title">还没有技能索引源</div>
      <div class="sm-empty-desc">添加一个技能索引源，就能浏览和安装市场里的技能。</div>
      <div class="sm-empty-actions">
        <button class="btn btn-primary" onclick="openSources()">${icon('plus', 15)} 添加源</button>
      </div>
    </div>`;
    return '<div class="page-col">' + content + renderFooter() + '</div>';
  }

  const q = state.marketSearch.trim().toLowerCase();
  const blocks = enabled.map(src => {
    let list = MARKET.filter(m => m.sourceName === src.name && m.sourceUrl === src.url);
    if (!q && list.length === 0) list = MARKET.filter(m => m.sourceName === src.name);
    if (q) list = list.filter(m => (m.name + ' ' + m.desc + ' ' + m.tags.join(' ')).toLowerCase().includes(q));
    if (state.marketSort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
    if (state.marketSort === 'updated') list = list.slice().sort((a, b) => b.updated.localeCompare(a.updated));
    if (list.length === 0) return '';
    const dot = src.status === 'ok' ? 'sm-dot-ok' : src.status === 'checking' ? 'sm-dot-update' : 'sm-dot-error';
    return `<section class="sm-source-block" data-source-id="${src.id}">
      <div class="sm-source-block-head">
        <span class="sm-dot ${dot}" style="position:static;border:none;flex-shrink:0;" data-tip="${src.status === 'ok' ? '源正常' : src.status === 'checking' ? '正在检查' : '源有错误'}"></span>
        <span class="sm-source-block-title">${escapeHtml(src.name)}</span>
        <span class="sm-source-block-count">${list.length} 个技能</span>
        <span class="sm-source-block-actions">
          <button class="sm-icon-btn plain" style="width:28px;height:28px;border-radius:9px;" aria-label="源操作" data-tip="刷新 / 删除 / 管理源" onclick="event.stopPropagation();openSourceMenu(event,'${src.id}')">${icon('more', 16)}</button>
        </span>
      </div>
      <div class="sm-grid">${list.map(renderMarketCard).join('')}</div>
    </section>`;
  }).filter(Boolean);

  if (blocks.length === 0) {
    content += `<div class="sm-empty">
      <div class="sm-empty-icon">${icon('search', 36)}</div>
      <div class="sm-empty-title">没有找到匹配的技能</div>
      <div class="sm-empty-desc">换个关键词，或清除搜索看看全部来源。</div>
      <div class="sm-empty-actions"><button class="btn btn-secondary" onclick="clearMarketSearch()">清除搜索</button></div>
    </div>`;
    return '<div class="page-col">' + content + renderFooter() + '</div>';
  }

  content += '<div class="sm-market-blocks">' + blocks.join('') + '</div>';
  return '<div class="page-col">' + content + renderFooter() + '</div>';
}

function renderMarketCard(item) {
  const isInstalled = item.installed;
  const hasUpdate = isInstalled && item.installedVersion && item.installedVersion !== item.version;
  let primary;
  if (!isInstalled) {

  } else if (hasUpdate) {
    primary = `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();updateMarketSkill('${item.id}')">更新</button>`;
  } else {
    primary = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openDetail('market','${item.id}')">已安装</button>`;

  return `<div class="sm-card-item" data-market-id="${item.id}" role="button" tabindex="0"
      onclick="openDetail('market','${item.id}')" onkeydown="if(event.key==='Enter') openDetail('market','${item.id}')">

function renderDetailPage() {
  if (!state.detail) return renderSkillsPage();
  if (state.detail.kind === 'market') {
    const item = MARKET.find(m => m.id === state.detail.id) || MARKET[0];
    return '<div class="page-col">' + renderMarketDetail(item) + renderFooter() + '</div>';

  const skill = SKILLS.find(s => s.id === state.detail.id) || SKILLS[0];

}

function renderInstalledDetail(skill) {
  const st = effectiveStatus(skill);
  const isBroken = st === 'broken';
  const isDisabled = st === 'disabled';
  const isReadonly = !skill.writable;

  let actions = '';
  if (isBroken) {
    actions += '<button class="btn btn-secondary" onclick="openDiag()">查看诊断</button>';
  } else if (isDisabled) {
    actions += '<button class="btn btn-secondary" onclick="toast(\'已恢复 ' + skill.id + '（原型）\')">恢复技能</button>';
  } else if (!isReadonly) {
    if (skill.update) actions += '<button class="btn btn-primary" onclick="openModal(\'update\',\'' + skill.id + '\')">更新到 v' + skill.update + '</button>';
    actions += '<button class="btn btn-secondary" onclick="openModal(\'edit\',\'' + skill.id + '\')">' + icon('edit', 15) + ' 编辑原文</button>';
  } else {
    actions += '<button class="btn btn-secondary" onclick="copyCommand(\'' + skill.id + '\')">' + icon('copy', 15) + ' 复制调用命令</button>';
  }

  const versionText = skill.version ? 'v' + skill.version : (skill.builtin ? '随 Harness 更新' : '—');

  let actionCard = '';
  if (isReadonly) {
    actionCard = `<div class="sm-card">
      <div class="sm-card-title">操作</div>
      <div class="sm-note neutral">这是 Harness 自带的内置技能，不能修改或删除。升级 Harness 时会自动更新。</div>
      <button class="btn btn-secondary" onclick="copyCommand('${skill.id}')">${icon('copy', 15)} 复制调用命令</button>
    </div>`;
  } else if (isBroken) {
    actionCard = `<div class="sm-card">
      <div class="sm-card-title">操作</div>
      <div class="sm-note">${escapeHtml(skill.reason || '')}</div>
      <div class="sm-action-stack">
        <button class="btn btn-secondary" onclick="fixIssue()">删除失效项</button>
        <button class="btn btn-danger-ghost" onclick="toast('已删除 ${escapeHtml(skill.name)}（原型）')">删除技能</button>
      </div>
    </div>`;
  } else if (isDisabled) {
    actionCard = `<div class="sm-card">
      <div class="sm-card-title">操作</div>
      <div class="sm-note neutral">已停用的技能不会被 Agent 调用，文件仍保留在原目录。</div>
      <div class="sm-action-stack">
        <button class="btn btn-secondary" onclick="toast('已恢复 ${escapeHtml(skill.name)}（原型）')">恢复技能</button>
        <button class="btn btn-danger-ghost" onclick="toast('已删除 ${escapeHtml(skill.name)}（原型）')">删除技能</button>
      </div>
    </div>`;
  } else {
    actionCard = `<div class="sm-card">
      <div class="sm-card-title">操作</div>
      <div class="sm-action-stack">
        <button class="btn btn-secondary" onclick="toast('已停用 ${escapeHtml(skill.name)}（原型）')">${icon('power', 15)} 停用技能</button>
        ${skill.market
          ? '<button class="btn btn-danger-ghost" onclick="openModal(\'uninstall\',\'' + skill.id + '\')">' + icon('trash', 15) + ' 卸载技能</button>'
          : '<button class="btn btn-danger-ghost" onclick="toast(\'已删除 ' + escapeHtml(skill.name) + '（原型）\')">' + icon('trash', 15) + ' 删除技能</button>'}
      </div>
    </div>`;

  return `
    <button class="sm-back" onclick="backToList()">← 返回</button>
    <div class="sm-detail-head">
      <div class="sm-detail-icon">${icon('skill', 28)}<span class="sm-dot ${statusDot(st)}"></span></div>
      <div class="sm-detail-heading">
        <div class="sm-detail-title-line">
          <span class="sm-detail-name mono">${escapeHtml(skill.name)}</span>
          ${skill.version ? '<span class="sm-detail-ver mono">v' + escapeHtml(skill.version) + '</span>' : ''}
          ${skill.update ? updateBadge(skill.update, skill.id) : ''}
          ${isBroken ? '<span class="sm-badge warn">未生效</span>' : ''}
          ${isDisabled ? '<span class="sm-badge">已停用</span>' : ''}

        <div class="sm-card">
          <div class="sm-card-title">
            <span>SKILL.md</span>

              ? '<span class="sm-badge">只读</span>'
              : '<button class="btn btn-secondary btn-sm" onclick="openModal(\'edit\',\'' + skill.id + '\')">' + icon('edit', 14) + ' 编辑</button>'}

  try {

    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : null;
  } catch {

}

  }
}

function moveSource(id, dir) {
  const idx = state.sources.findIndex(s => s.id === id);
  if (idx < 0) return;
  const next = idx + dir;
  if (next < 0 || next >= state.sources.length) return;
  const moved = state.sources.splice(idx, 1)[0];
  state.sources.splice(next, 0, moved);
  state.menu = null;
  saveSourceOrder();
  render();
  toast('已' + (dir < 0 ? '上移' : '下移') + '「' + moved.name + '」，市场顺序已更新');
}

/* v3.2 管理源：拖动排序 */
let dragSourceId = null;
let dragDropAfter = false;

function clearSourceDropMarks() {
  document.querySelectorAll('.sm-source.is-drop-before, .sm-source.is-drop-after').forEach(el => {
    el.classList.remove('is-drop-before', 'is-drop-after');
  });
}

function onSourceDragStart(e, id) {
  dragSourceId = id;
  dragDropAfter = false;
  if (e.dataTransfer) {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (err) { /* noop */ }
  }
  e.currentTarget.classList.add('is-dragging');
}

function onSourceDragOver(e, id) {
  if (!dragSourceId || dragSourceId === id) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  const row = e.currentTarget;
  const r = row.getBoundingClientRect();
  dragDropAfter = e.clientY > r.top + r.height / 2;
  clearSourceDropMarks();
  row.classList.add(dragDropAfter ? 'is-drop-after' : 'is-drop-before');
}

function onSourceDrop(e, id) {
  e.preventDefault();
  const fromId = dragSourceId;
  const after = dragDropAfter;
  clearSourceDropMarks();
  dragSourceId = null;
  if (!fromId || fromId === id) return;
  const from = state.sources.findIndex(s => s.id === fromId);
  if (from < 0) return;
  const moved = state.sources.splice(from, 1)[0];
  let to = state.sources.findIndex(s => s.id === id);
  if (to < 0) {
    state.sources.splice(from, 0, moved);
    return;
  }
  if (after) to += 1;
  state.sources.splice(to, 0, moved);
  saveSourceOrder();
  render();
  toast('已调整「' + moved.name + '」的位置，市场顺序已更新');
}

function onSourceDragEnd() {
  clearSourceDropMarks();
  dragSourceId = null;
  document.querySelectorAll('.sm-source.is-dragging').forEach(el => el.classList.remove('is-dragging'));
}

// 可访问性兜底：行获得焦点后 Alt+↑ / Alt+↓ 移动
function onSourceKeydown(e, id) {
  if (!e.altKey) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    moveSource(id, e.key === 'ArrowUp' ? -1 : 1);
  }
}

/* v3.2 合并「检查更新」与「刷新列表」：一个动作，转圈后给出汇总 */
function checkForUpdates() {
  if (state.checking) return;
  const enabledCount = state.sources.filter(s => s.enabled).length;
  state.checking = true;
  render();
  setTimeout(() => {
    state.checking = false;
    state.sources.forEach(src => {
      if (src.enabled) {
        src.status = 'ok';
        src.checked = '刚刚';
        src.error = null;
      }
    });
    render();
    toast('已检查 ' + enabledCount + ' 个源，' + updateCountNow() + ' 个技能可更新');
  }, 900);
}

function openUpdateFlow() {
  const skill = visibleSkills().find(s => effectiveStatus(s) === 'active' && s.update);
  if (skill) openModal('update', skill.id);
  else toast('当前没有可更新的技能');
}

function openDetail(kind, id) {
  state.view = 'detail';
  state.detail = { kind: kind, id: id };
  state.tab = kind === 'market' ? 'market' : 'skills';
  state.menu = null;
  state.highlight = null;
  render();
}

function backToList() {
  state.view = 'list';
  state.detail = null;
  render();
}

function openDiag() {
  state.diagOpen = true;
  state.sourcesOpen = false;
  state.menu = null;
  render();
}

function closeDiag() {
  state.diagOpen = false;
  render();
}

function openSources() {
  state.sourcesOpen = true;
  state.diagOpen = false;
  state.menu = null;
  render();
}

function closeSources() {
  state.sourcesOpen = false;
  render();
}

function fixIssue() {
  state.issueFixed = true;
  state.diagOpen = true;
  render();
  toast('已删除失效项，ego-browser 重新生效了');
}

function toggleSource(id) {
  const src = state.sources.find(s => s.id === id);
  if (!src) return;
  src.enabled = !src.enabled;
  render();
}

function refreshSource(id) {
  const src = state.sources.find(s => s.id === id);
  if (!src) return;
  src.status = 'checking';
  src.checked = '正在检查…';
  src.error = null;
  render();
  setTimeout(() => {
    const again = state.sources.find(s => s.id === id);
    if (!again) return;
    again.status = 'ok';
    again.checked = '刚刚';
    render();
  }, 900);
}

function removeSource(id) {
  state.sources = state.sources.filter(s => s.id !== id);
  render();
  toast('已删除这个源');
}

function createSource() {
  const urlInput = document.getElementById('source-url');
  const nameInput = document.getElementById('source-name');
  const url = urlInput ? urlInput.value.trim() : '';
  if (!url) {
    toast('请先填入索引地址');
    if (urlInput) urlInput.focus();
    return;
  }
  const name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '新索引源';
  const id = 'custom-' + Date.now();
  state.sources.push({
    id: id,
    name: name,
    url: url,
    enabled: true,
    status: 'checking',
    count: 0,
    checked: '正在检查…',
    error: null
  });
  state.modal = null;
  render();
  toast('已添加索引源，正在检查…');
  setTimeout(() => {
    const added = state.sources.find(s => s.id === id);
    if (!added) return;
    added.status = 'ok';
    added.checked = '刚刚';
    added.count = 3;
    render();
  }, 1200);
}

function doImport() {
  state.modal = null;
  render();
  toast('已导入技能，正在检查 SKILL.md');
}

function openModal(kind, id) {
  state.modal = { kind: kind, id: id };
  state.menu = null;
  render();
}

function closeModal() {
  state.modal = null;
  render();
}

function setSaveTo(value) {
  state.saveTo = value;
  render();
}

function setInstallTarget(value) {
  state.installTarget = value;
  render();
}

function createSkill() {
  const input = document.getElementById('new-skill-name');
  const name = input && input.value.trim() ? input.value.trim() : 'release-notes-writer';
  state.modal = null;
  render();
  toast('已创建 ' + name);
}

function doUpdate(id) {
  state.modal = null;
  render();
  toast('正在更新 ' + id + '，完成后会通知你');
}

function doUninstall(id) {
  const skill = SKILLS.find(s => s.id === id);
  const verb = skill && skill.market ? '卸载' : '删除';
  state.modal = null;
  render();
  toast('已' + verb + ' ' + id + '，文件已移到备份目录');
}

function saveEdit(id) {
  const el = document.getElementById('edit-skill-body');
  const body = el ? el.value : '';
  const skill = SKILLS.find(s => s.id === id);
  if (skill && body) skill.body = body;
  state.modal = null;
  render();
  toast('已保存 ' + id + ' 的 SKILL.md');
}

function installSkill(id) {
  const item = MARKET.find(x => x.id === id);
  if (item && item.installed) {
    toast(id + ' 已经安装');
    return;
  }
  if (item) {
    item.installed = true;
    item.installedVersion = item.version;
  }
  render();
  toast('已开始安装 ' + id + '…');
}

function updateMarketSkill(id) {
  const item = MARKET.find(x => x.id === id);
  if (!item) return;
  item.installed = true;
  item.installedVersion = item.version;
  render();
  toast('已更新 ' + id + ' 到 v' + item.version);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => toast('已复制'));
  } else {
    toast('已复制');
  }
}

function copySkillPath(id) {
  const skill = SKILLS.find(s => s.id === id);
  copyText(skill ? skill.path : id);
}

function copyCommand(id) {
  copyText('/' + id);
}

function openRowMenu(e, id) {
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  const width = 184;
  let x = Math.min(Math.max(8, r.right - width), window.innerWidth - width - 8);
  let y = r.bottom + 6;
  if (y + 280 > window.innerHeight) y = Math.max(52, r.top - 280);
  state.menu = { type: 'row', id: id, x: x, y: y };
  render();
}


function openSourceMenu(e, id) {
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  const width = 184;
  let x = Math.min(Math.max(8, r.right - width), window.innerWidth - width - 8);
  let y = r.bottom + 6;
  if (y + 230 > window.innerHeight) y = Math.max(52, r.top - 230);
  state.menu = { type: 'source', id: id, x: x, y: y };
  render();
}

function openMarketMenu(e, id) {
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  const width = 184;
  let x = Math.min(Math.max(8, r.right - width), window.innerWidth - width - 8);
  let y = r.bottom + 6;
  if (y + 120 > window.innerHeight) y = Math.max(52, r.top - 120);
  state.menu = { type: 'market', id: id, x: x, y: y };
  render();
}

function menuAction(action, id) {
  state.menu = null;
  if (action === 'market-detail') {
    openDetail('market', id);
    return;
  }
  if (action === 'market-install') {
    installSkill(id);
    return;
  }
  if (action === 'market-update') {
    updateMarketSkill(id);
    return;
  }
  if (action === 'detail') {
    openDetail('installed', id);
    return;
  }
  if (action === 'copy') {
    copySkillPath(id);
    render();
    return;
  }
  if (action === 'copy-command') {
    copyCommand(id);
    render();
    return;
  }
  if (action === 'toggle') {
    const skill = SKILLS.find(s => s.id === id);
    const wasDisabled = skill && effectiveStatus(skill) === 'disabled';
    render();
    toast(wasDisabled ? '已恢复 ' + id + '（原型）' : '已停用 ' + id + '（原型）');
    return;
  }
  if (action === 'uninstall') {
    openModal('uninstall', id);
    return;
  }
  if (action === 'why') {
    render();
    toast('Harness 自带的内置技能不能修改，升级 Harness 时会自动更新。');
    return;
  }
  if (action === 'sources') {
    openSources();
    return;
  }
  render();
}

/*************************************************************************
 * 12. Toast / Tooltip / 键盘
 *************************************************************************/
function toast(message) {
  const host = document.getElementById('toast-host');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'sm-toast';
  el.innerHTML = '<span style="color:var(--dsw-alias-state-success-primary);display:inline-flex;">' + icon('check', 15) + '</span><span>' + escapeHtml(message) + '</span>';
  host.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 3200);
}

let tipTimer = null;
let tipTarget = null;

function hideTooltip() {
  if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
  tipTarget = null;
  const el = document.getElementById('tooltip');
  if (el) el.classList.remove('visible');
}

document.addEventListener('mouseover', (e) => {
  const el = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!el) { hideTooltip(); return; }
  if (el === tipTarget) return;
  hideTooltip();
  tipTarget = el;
  tipTimer = setTimeout(() => {
    if (!tipTarget || !document.body.contains(tipTarget)) return;
    const tip = document.getElementById('tooltip');
    if (!tip) return;
    tip.textContent = tipTarget.getAttribute('data-tip');
    tip.classList.add('visible');
    const r = tipTarget.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let left = r.left + r.width / 2 - tr.width / 2;
    let top = r.top - tr.height - 6;
    if (left < 8) left = 8;
    if (left + tr.width > window.innerWidth - 8) left = window.innerWidth - tr.width - 8;
    if (top < 8) top = r.bottom + 6;
    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
  }, 300);
});

document.addEventListener('mouseout', (e) => {
  if (tipTarget && (!e.relatedTarget || !tipTarget.contains(e.relatedTarget))) hideTooltip();
});
document.addEventListener('mousedown', hideTooltip);

document.addEventListener('click', (e) => {
  if (!state.menu) return;
  if (e.target.closest && e.target.closest('.sm-menu')) return;
  state.menu = null;
  render();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.menu) { state.menu = null; render(); return; }
    if (state.modal) { state.modal = null; render(); return; }
    if (state.diagOpen) { state.diagOpen = false; render(); return; }
    if (state.sourcesOpen) { state.sourcesOpen = false; render(); return; }
    if (state.view === 'detail') { backToList(); return; }
  }
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
    const el = document.getElementById('search-input');
    if (el) { e.preventDefault(); el.focus(); }
  }
});

/*************************************************************************
 * 13. 启动
 *************************************************************************/
initScreenSelect();
</script>
