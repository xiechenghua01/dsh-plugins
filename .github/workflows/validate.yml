name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version entries pin commits: the index check needs the full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  purge:
    # The index is served from a jsDelivr branch URL, which caches for 12 hours;
    # refresh it right after main changes so new versions show up in Discover.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr branch cache
        # Best-effort: a throttled or failing purge must not fail the build, because
        # the index still goes live on its own within the 12-hour cache window.
        run: |
          curl -fsS -m 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/index.json" \
            || echo "::warning::jsDelivr purge failed; the index will refresh within 12 hours"
